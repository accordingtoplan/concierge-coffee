<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Concierge Coffee</title>
<meta name="robots" content="noindex">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<style>
  /* Standalone on purpose: the one page that must render when something
     else has already gone wrong carries no dependencies. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    color: #111;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  main { max-width: 46ch; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(32px, 5vw, 54px);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.04;
    margin-bottom: 16px;
  }
  p { font-size: 12px; line-height: 1.85; color: #6f6f6f; margin-bottom: 24px; }
  nav { display: flex; gap: 24px; }
  a {
    color: #111;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-bottom: 1px solid #eee;
    padding-bottom: 2px;
    transition: border-color 0.15s;
  }
  a:hover { border-color: #111; }
</style>
</head>
<body>
<main>
  <h1>Not here.</h1>
  <p>The page you were after does not exist, or has moved. Everything that does is a link away.</p>
  <nav>
    <a href="/">Home</a>
    <a href="/shop.html">Shop</a>
    <a href="/visit.html">Visit</a>
  </nav>
</main>
</body>
</html>
